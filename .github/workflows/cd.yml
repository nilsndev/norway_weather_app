name: CD - Frontend and Backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-frontend:
    name: Deploy frontend to S3
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: norway_weather_ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: norway_weather_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload frontend to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-backend:
    name: Deploy backend to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          repository="norway-weather-app-development-backend"
          image_tag="sha-${GITHUB_SHA}"
          image_uri="${ECR_REGISTRY}/${repository}:${image_tag}"

          docker build \
            --file norway_weather_api/Dockerfile \
            --tag "$image_uri" \
            .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Register task definition with the new image
        run: |
          aws ecs describe-task-definition \
            --task-definition norway-weather-app-development-backend \
            --query taskDefinition > task-definition.json

          jq --arg image "$IMAGE_URI" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(
                if .name == "backend" then .image = $image else . end
              )
          ' task-definition.json > task-definition-register.json

          aws ecs register-task-definition \
            --cli-input-json file://task-definition-register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text > task-definition-arn.txt
          echo "TASK_DEFINITION_ARN=$(cat task-definition-arn.txt)" >> "$GITHUB_ENV"

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster norway-weather-app-development-cluster \
            --service norway-weather-app-development-backend \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment
